 name: Apex Money Production Deployment Pipeline

on:
  push:
    branches:
      - main  # Triggers automation automatically whenever you push code to your main branch

jobs:
  audit-and-test:
    name: Code Integrity & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install System Dependencies
        run: npm ci

      - name: Run Security Vulnerability Audit
        run: npm audit --audit-level=high --omit=dev

  zero-downtime-deploy:
    name: Blue-Green Cloud Deployment
    needs: audit-and-test
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-3 # Paris region (provides optimal latency paths to West Africa/Guinea)

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Administrative Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Production Environment Variables
        run: |
          echo "Writing runtime production configurations safely..."
          echo "PORT=4000" >> .env
          echo "MOCK_DB_PATH='./apex_money_ledger.json'" >> .env

      - name: Execute Blue-Green Sync with Production Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          source: "./*"
          target: "/home/ubuntu/apex-money-temp"

      - name: Seamless Switch Traffic to New Code (Zero Downtime)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          script: |
            echo "Moving code payload into isolated runtime container..."
            rm -rf /home/ubuntu/apex-money-production-green
            mv /home/ubuntu/apex-money-temp /home/ubuntu/apex-money-production-green
            cd /home/ubuntu/apex-money-production-green
            
            echo "Installing production node components..."
            npm install --omit=dev
            
            echo "Starting Green environment background servers..."
            pm2 delete apex-money-green || true
            pm2 start server.js --name "apex-money-green" --env .env
            
            echo "Validating system health parameters locally..."
            sleep 5
            curl --fail http://localhost:4000/api/portal/owner/audit-summary -H "X-Caller-ID: OWNER_MAIN" || exit 1
            
            echo "Rerouting active user gateways from Blue container to Green container..."
            # Simulates or reloads local Nginx proxy maps seamlessly without cutting connections
            sudo systemctl reload nginx
            echo "Deployment transaction successfully committed. Systems active."
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1  # Add this line to handle backend server communication
